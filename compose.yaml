name: meridian-risk
services:
  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: meridian
      POSTGRES_DB: meridian
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set a random hexadecimal POSTGRES_PASSWORD in .env}
    volumes:
      - research-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U meridian -d meridian"]
      interval: 3s
      timeout: 3s
      retries: 25
  console:
    build:
      context: .
      dockerfile: infrastructure/Dockerfile
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg://meridian:${POSTGRES_PASSWORD}@db:5432/meridian
      AGENT_MODE: ${AGENT_MODE:-demo}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4.1-mini}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      INPUT_USD_PER_M: ${INPUT_USD_PER_M:-}
      CACHED_INPUT_USD_PER_M: ${CACHED_INPUT_USD_PER_M:-}
      OUTPUT_USD_PER_M: ${OUTPUT_USD_PER_M:-}
    ports:
      - "127.0.0.1:8000:8000"
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health',timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 12
volumes:
  research-data:
