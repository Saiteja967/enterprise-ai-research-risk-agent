name: Verify research console
on: [push, pull_request]
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      pg:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_DB: test_meridian
          POSTGRES_USER: runner
          POSTGRES_PASSWORD: ephemeral-test-only
        ports: ["5432:5432"]
        options: --health-cmd="pg_isready -U runner -d test_meridian" --health-interval=3s --health-timeout=3s --health-retries=20
    env:
      TEST_POSTGRES_URL: postgresql+psycopg://runner:ephemeral-test-only@127.0.0.1:5432/test_meridian
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12', cache: pip, cache-dependency-path: tests/requirements.txt}
      - run: pip install -r tests/requirements.txt
      - run: ruff check backend tests && ruff format --check backend tests && mypy backend && pytest -q
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - uses: actions/setup-node@v4
        with: {node-version: '24', cache: npm, cache-dependency-path: frontend/package-lock.json}
      - run: python -m venv .venv && .venv/bin/pip install -r backend/requirements.txt
      - run: npm ci && npm run lint && npx prettier --check src e2e && npm run build && npx playwright install --with-deps chromium && npm run smoke
        working-directory: frontend
  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Start isolated Compose demo and inspect live health
        env:
          POSTGRES_PASSWORD: ephemeral-compose-only
        run: |
          docker compose up --build --wait --wait-timeout 180
          curl --fail http://127.0.0.1:8000/api/health
          docker compose down --volumes
